
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1">
<title>計數計算器</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
  background: #f5f5f5;
}
button {
  font-size: 24px;
  padding: 12px 22px;
  margin: 5px;
  cursor: pointer;
}
#number {
  font-size: 60px;
  color: green;
}
</style>
</head>
<body>
<h1>計數計算器</h1>
<div id="number">0</div>

<button onclick="change(-1)">－1</button>
<button onclick="change(1)">＋1</button>
<button onclick="reset()">歸零</button>

<p>數字會自動儲存在這個瀏覽器中</p>

<script>
let count = Number(
  localStorage.getItem("savedCount") ?? 0
);

if (!Number.isFinite(count)) count = 0;

showCount();

function showCount() {
  document.getElementById("number").textContent = count;
  localStorage.setItem("savedCount", String(count));
}

function change(n) {
  count += n;
  showCount();
}

function reset() {
  count = 0;
  showCount();
}
</script>
</body>
</html>
